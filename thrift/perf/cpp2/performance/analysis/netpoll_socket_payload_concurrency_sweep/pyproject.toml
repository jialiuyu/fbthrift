[project]
name = "netpoll-socket-payload-concurrency-analysis"
version = "0.1.0"
description = "Analysis and academic plots for the Netpoll Socket payload by concurrency sweep"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9,<4"]

[project.scripts]
netpoll-socket-baseline-plot = "netpoll_socket_payload_analysis:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netpoll_socket_payload_analysis.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
