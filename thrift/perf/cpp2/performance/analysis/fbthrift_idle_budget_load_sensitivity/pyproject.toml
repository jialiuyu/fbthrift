[project]
name = "fbthrift-idle-budget-load-sensitivity-analysis"
version = "0.1.0"
description = "Analysis and academic plots for the fbthrift Ubmem idle load sensitivity sweep"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
]

[project.scripts]
fbthrift-idle-plot = "fbthrift_idle_analysis:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbthrift_idle_analysis.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
